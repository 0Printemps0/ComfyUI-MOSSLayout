[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-mosslayout"
version = "1.0.0"
description = "Visual studio for composing MOSS-Image Layout JSON box prompts in ComfyUI, forked from ComfyUI-IdeogramHelper"
authors = [
  {name = "Henry Lee", email = "contact@nynxz.com"}
]
readme = "README.md"
license = {text = "GNU General Public License v3"}
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/nynxz/ComfyUI-IdeogramHelper"
Upstream = "https://github.com/nynxz/ComfyUI-IdeogramHelper"

[tool.comfy]
PublisherId = "nynxz"
DisplayName = "ComfyUI MOSS Helper"
Tags = ["moss-image", "prompt", "json", "bbox", "studio"]
Icon = "https://avatars.githubusercontent.com/u/60878743?v=4"
Repository = "https://github.com/nynxz/ComfyUI-IdeogramHelper"
includes = ["web"]

[tool.setuptools.package-data]
"*" = ["*.*"]
